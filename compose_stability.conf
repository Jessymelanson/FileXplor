// Types the Compose compiler cannot infer as stable, but which are.
//
// Everything Compose sees from outside the module counts as unstable unless
// told otherwise, which matters most in a photo grid: every cell is keyed on a
// Photo, so an unstable Photo makes all of them unskippable and selecting one
// picture recomposes the several hundred on screen.
//
// Both are genuinely immutable — every property is a val over immutable data.
com.jphotos.app.data.photos.Photo
com.jphotos.app.data.photos.PhotoFolder
